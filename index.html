<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализация</title>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --edge: #bfbfbf;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Spectral', Georgia, serif;
            background-color: #f0f1f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-bezel {
            position: relative;
            background-color: #1c2438;
            padding: 8px;
            border-radius: 35px;
            box-shadow: 0 18px 45px rgba(20, 30, 60, 0.35);
            width: 100%;
            max-width: 420px;
            height: 800px;
            box-sizing: border-box;
        }

        .notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 175px;
            height: 17px;
            background-color: #1c2438;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 10;
        }

        .screen {
            position: relative;
            background-image: url('doc.jpeg');
            background-size: 100% 100%;
            border-radius: 28px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
        }

        .header {
            position: absolute;
            top: 75px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        .header h1 {
            color: #2b2b2b;
            font-size: 36px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #555555;
            font-size: 19px;
            font-weight: 400;
            margin-top: -5px;
            letter-spacing: 0.5px;
        }

        .buttons-container {
            position: absolute;
            top: 49%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 2;
        }

        .btn {
            display: flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            color: #2b2b2b;
            padding: 16px 18px 16px 19px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 22px;
            box-shadow: 0 9px 17px rgba(0,0,0,0.10);
            border: 0.5px solid rgba(0, 0, 0, 0.35);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
            background-color: rgba(255, 255, 255, 0.7);
        }

        .btn:active {
            transform: scale(0.98);
            background-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14);
            transition: transform 0.08s, box-shadow 0.08s, background-color 0.08s;
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 9px 17px rgba(0,0,0,0.10), 0 0 0 2px rgba(255, 255, 255, 0.9);
        }

        .icon-circle {
            width: 58px;
            height: 58px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-circle img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .btn-text {
            flex-grow: 1;
            padding-left: 5px;
            color: #2b2b2b;
        }

        .arrow {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .arrow svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #2b2b2b;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .filler, .seam {
            display: none;
        }

        @media (max-width: 1300px) {
            body {
                overflow: hidden;
                background-color: var(--edge);
            }
            .phone-bezel {
                max-width: 100%;
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
                background-color: transparent;
            }
            .notch {
                display: none;
            }
            .screen {
                width: 404px;
                height: 784px;
                border-radius: 0;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(var(--scale, 1));
                transform-origin: center center;
            }
            .filler {
                display: block;
                position: fixed;
                left: 0;
                width: 100%;
                overflow: hidden;
                z-index: 1;
                pointer-events: none;
                background-color: var(--edge);
            }
            .filler-top { top: 0; }
            .filler-bottom { bottom: 0; }
            .filler-inner {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                width: calc(404px * var(--scale, 1));
                height: calc(784px * var(--scale, 1));
                background-image: url('doc.jpeg');
                background-size: 100% 100%;
                background-color: var(--edge);
            }
            .filler-top .filler-inner { bottom: 0; }
            .filler-bottom .filler-inner { top: 0; }
            .seam {
                display: block;
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                width: calc(404px * var(--scale, 1));
                height: 32px;
                background: linear-gradient(to bottom,
                    rgba(191, 191, 191, 0) 0%,
                    rgba(191, 191, 191, 0.5) 20%,
                    rgba(191, 191, 191, 1) 38%,
                    rgba(191, 191, 191, 1) 62%,
                    rgba(191, 191, 191, 0.5) 80%,
                    rgba(191, 191, 191, 0) 100%);
                z-index: 5;
                pointer-events: none;
            }
            body.scroll-mode {
                overflow-x: hidden;
                overflow-y: auto;
                display: block;
            }
            body.scroll-mode .phone-bezel {
                position: relative;
            }
            body.scroll-mode .screen {
                position: absolute;
                top: 0;
                left: 50%;
                margin-left: calc(-202px * var(--scale, 1));
                transform: scale(var(--scale, 1));
                transform-origin: top left;
            }
            body.scroll-mode .filler,
            body.scroll-mode .seam {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="filler filler-top">
        <div class="filler-inner"></div>
    </div>
    <div class="filler filler-bottom">
        <div class="filler-inner"></div>
    </div>

    <div class="phone-bezel">
        <div class="notch"></div>
        <div class="screen">
            <div class="header">
                <h1>Визуализация</h1>
                <p>А.Е. Большакова</p>
            </div>
            <div class="buttons-container">
                <a href="https://web.archive.org/web/20231202204627/https://bnplaw.ru/analytics/cases/vizualizatsiya-tezisov-v-ugolovnom-dele-pozitsiya-stala-ponyatnee-a-realnyy-srok-uslovnym-/#:~:text=%D1%80%D0%B5%D1%88%D0%B8%D0%BB%D0%B8%2C%20%D1%80%D0%B0%D1%81%D1%81%D0%BA%D0%B0%D0%B7%D1%8B%D0%B2%D0%B0%D0%B5%D0%BC%20%D0%B4%D0%B0%D0%BB%D1%8C%D1%88%D0%B5.-,%D0%A1%D1%85%D0%B5%D0%BC%D0%B0.%20%D0%A0%D0%B0%D0%B7%D0%B3%D1%80%D0%B0%D0%BD%D0%B8%D1%87%D0%B8%D0%BB%D0%B8%20%D1%83%D0%B3%D0%BE%D0%BB%D0%BE%D0%B2%D0%BD%D0%BE%D0%B5%20%D0%B8%20%D0%B0%D0%B4%D0%BC%D0%B8%D0%BD%D0%B8%D1%81%D1%82%D1%80%D0%B0%D1%82%D0%B8%D0%B2%D0%BD%D0%BE%D0%B5%20%D0%B4%D0%B5%D0%BB%D0%B0,%D0%A3%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D1%8F%D1%8E%D1%89%D0%B8%D0%B9%20%D0%BF%D0%B0%D1%80%D1%82%D0%BD%D0%B5%D1%80%20%D0%90%D0%91%20%C2%AB%D0%91%D0%BE%D0%BB%D1%8C%D1%88%D0%B0%D0%BA%D0%BE%D0%B2%2C%20%D0%A7%D0%B5%D0%BB%D1%8B%D1%88%D0%B5%D0%B2%20%D0%B8%20%D0%9F%D0%B0%D1%80%D1%82%D0%BD%D0%B5%D1%80%D1%8B%C2%BB,-%D0%A2%D0%B0%D0%B1%D0%BB%D0%B8%D1%86%D0%B0.%20%D0%9F%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D0%BB%D0%B8%20%D0%BD%D0%B5%D1%81%D0%BE%D0%BE%D1%82%D0%B2%D0%B5%D1%82%D1%81%D1%82%D0%B2%D0%B8%D0%B5" target="_blank" rel="noopener noreferrer" class="btn">
                    <div class="icon-circle"><img src="icon1.png" alt="Схема"></div>
                    <div class="btn-text">Схема</div>
                    <div class="arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
                </a>
                <a href="https://web.archive.org/web/20231202204627/https://bnplaw.ru/analytics/cases/vizualizatsiya-tezisov-v-ugolovnom-dele-pozitsiya-stala-ponyatnee-a-realnyy-srok-uslovnym-/#:~:text=%D0%A7%D0%B5%D0%BB%D1%8B%D1%88%D0%B5%D0%B2%20%D0%B8%20%D0%9F%D0%B0%D1%80%D1%82%D0%BD%D0%B5%D1%80%D1%8B%C2%BB-,%D0%A2%D0%B0%D0%B1%D0%BB%D0%B8%D1%86%D0%B0.%20%D0%9F%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D0%BB%D0%B8%20%D0%BD%D0%B5%D1%81%D0%BE%D0%BE%D1%82%D0%B2%D0%B5%D1%82%D1%81%D1%82%D0%B2%D0%B8%D0%B5%20%D0%BF%D0%BE%D0%B7%D0%B8%D1%86%D0%B8%D0%B9%20%D0%A4%D0%90%D0%A1%20%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D0%B8%20%D0%B8%20%D0%BE%D0%B1%D0%B2%D0%B8%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F,%D0%A3%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D1%8F%D1%8E%D1%89%D0%B8%D0%B9%20%D0%BF%D0%B0%D1%80%D1%82%D0%BD%D0%B5%D1%80%20%D0%90%D0%91%20%C2%AB%D0%91%D0%BE%D0%BB%D1%8C%D1%88%D0%B0%D0%BA%D0%BE%D0%B2%2C%20%D0%A7%D0%B5%D0%BB%D1%8B%D1%88%D0%B5%D0%B2%20%D0%B8%20%D0%9F%D0%B0%D1%80%D1%82%D0%BD%D0%B5%D1%80%D1%8B%C2%BB,-%D0%94%D0%B8%D0%B0%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D0%B0.%20%D0%94%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D0%BB%D0%B8%20%D0%BE%D1%82%D1%81%D1%83%D1%82%D1%81%D1%82%D0%B2%D0%B8%D0%B5" target="_blank" rel="noopener noreferrer" class="btn">
                    <div class="icon-circle"><img src="icon1.png" alt="Таблица"></div>
                    <div class="btn-text">Таблица</div>
                    <div class="arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
                </a>
                <a href="https://web.archive.org/web/20231202204627/https://bnplaw.ru/analytics/cases/vizualizatsiya-tezisov-v-ugolovnom-dele-pozitsiya-stala-ponyatnee-a-realnyy-srok-uslovnym-/#:~:text=%D0%A7%D0%B5%D0%BB%D1%8B%D1%88%D0%B5%D0%B2%20%D0%B8%20%D0%9F%D0%B0%D1%80%D1%82%D0%BD%D0%B5%D1%80%D1%8B%C2%BB-,%D0%94%D0%B8%D0%B0%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D0%B0.%20%D0%94%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D0%BB%D0%B8%20%D0%BE%D1%82%D1%81%D1%83%D1%82%D1%81%D1%82%D0%B2%D0%B8%D0%B5%20%D1%8D%D0%BB%D0%B5%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%20%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%B0%20%D0%BF%D1%80%D0%B5%D1%81%D1%82%D1%83%D0%BF%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F,%D0%A1%D0%BE%D0%BF%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%B8%D1%82%D1%8C%20%D0%B2%D0%B5%D0%BB%D0%B8%D1%87%D0%B8%D0%BD%D1%8B%20%D0%BD%D0%B0%D0%BC%20%D0%BF%D0%BE%D0%BC%D0%BE%D0%B3%D0%BB%D0%B0%20%D0%B4%D0%B8%D0%B0%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D0%B0%3A,-Legal%20Design%20%D0%B4%D0%BB%D1%8F" target="_blank" rel="noopener noreferrer" class="btn">
                    <div class="icon-circle"><img src="icon1.png" alt="Диаграмма"></div>
                    <div class="btn-text">Диаграмма</div>
                    <div class="arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
                </a>
            </div>
        </div>
    </div>

    <div class="seam seam-top"></div>
    <div class="seam seam-bottom"></div>

    <script>
        var MOBILE_WIDTH = 1300;
        var SEAM_HALF = 16;

        function fitScreen() {
            var w = window.innerWidth;
            var h = window.innerHeight;
            var bezel = document.querySelector('.phone-bezel');

            if (w > MOBILE_WIDTH) {
                document.body.classList.remove('scroll-mode');
                if (bezel) bezel.style.height = '';
                return;
            }

            var scale = w / 404;
            document.documentElement.style.setProperty('--scale', scale);
            var screenH = 784 * scale;

            if (screenH > h) {
                document.body.classList.add('scroll-mode');
                if (bezel) bezel.style.height = screenH + 'px';
            } else {
                document.body.classList.remove('scroll-mode');
                if (bezel) bezel.style.height = '';

                var fillerHeight = Math.max(0, (h - screenH) / 2);
                var top = document.querySelector('.filler-top');
                var bottom = document.querySelector('.filler-bottom');
                if (top) top.style.height = fillerHeight + 'px';
                if (bottom) bottom.style.height = fillerHeight + 'px';

                var half = screenH / 2;
                var centerY = h / 2;
                var seamTop = document.querySelector('.seam-top');
                var seamBottom = document.querySelector('.seam-bottom');
                if (seamTop) seamTop.style.top = (centerY - half - SEAM_HALF) + 'px';
                if (seamBottom) seamBottom.style.top = (centerY + half - SEAM_HALF) + 'px';
            }
        }

        window.addEventListener('resize', fitScreen);
        window.addEventListener('orientationchange', function () {
            fitScreen();
            setTimeout(fitScreen, 100);
            setTimeout(fitScreen, 300);
        });
        window.addEventListener('load', fitScreen);
        fitScreen();
    </script>
</body>
</html>
